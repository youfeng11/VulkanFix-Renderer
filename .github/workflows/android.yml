name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 768M
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native compiler cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          ccache --version

      - name: Install pinned NDK
        id: ndk
        run: |
          vulkanfix_ndk_version="$(sed -n 's/^vulkanFixNdkVersion=//p' gradle.properties | tr -d '\r')"
          test -n "$vulkanfix_ndk_version"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$vulkanfix_ndk_version"
          echo "version=$vulkanfix_ndk_version" >> "$GITHUB_OUTPUT"

      - name: Restore native compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: native-v1-ubuntu24-${{ matrix.abi }}-ndk${{ steps.ndk.outputs.version }}-${{ github.sha }}
          restore-keys: |
            native-v1-ubuntu24-${{ matrix.abi }}-ndk${{ steps.ndk.outputs.version }}-

      - name: Build and strip native libraries
        run: |
          chmod +x gradlew
          ccache --zero-stats
          ./gradlew :layer:stripDebugDebugSymbols :layer:stripReleaseDebugSymbols \
            -Pandroid.injected.build.abi=${{ matrix.abi }} \
            --build-cache --max-workers=2 --console=plain

      - name: Stage native libraries
        env:
          ABI: ${{ matrix.abi }}
        run: |
          for variant in debug release; do
            if [ "$variant" = debug ]; then task=stripDebugDebugSymbols; else task=stripReleaseDebugSymbols; fi
            library="layer/build/intermediates/stripped_native_libs/$variant/$task/out/lib/$ABI/libvulkan_fix.so"
            test -s "$library"
            mkdir -p "layer/build/ci-native/$variant/$ABI"
            cp "$library" "layer/build/ci-native/$variant/$ABI/"
          done

      - name: Show native cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload native libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.abi }}
          path: layer/build/ci-native/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: native
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: layer/build/ci-native
          merge-multiple: true

      - name: Install pinned NDK tools
        id: ndk
        run: |
          vulkanfix_ndk_version="$(sed -n 's/^vulkanFixNdkVersion=//p' gradle.properties | tr -d '\r')"
          test -n "$vulkanfix_ndk_version"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$vulkanfix_ndk_version"
          vulkanfix_ndk_bin="$ANDROID_HOME/ndk/$vulkanfix_ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$vulkanfix_ndk_bin/llvm-strip"
          test -x "$vulkanfix_ndk_bin/llvm-readelf"
          echo "bin=$vulkanfix_ndk_bin" >> "$GITHUB_OUTPUT"

      - name: Package APKs without native compilation
        run: |
          chmod +x gradlew
          ./gradlew :pluginApp:assembleDebug :pluginApp:assembleRelease \
            -PvulkanFixPrebuiltDir=layer/build/ci-native \
            --build-cache --max-workers=2 --console=plain

      - name: Check packaged native libraries
        run: |
          python3 tools/check_apk_native_libs.py \
            --readelf "${{ steps.ndk.outputs.bin }}/llvm-readelf" \
            --check-16k \
            --require-abis arm64-v8a,armeabi-v7a,x86,x86_64 \
            pluginApp/build/outputs/apk/debug/*.apk \
            pluginApp/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pluginApp-debug
          path: pluginApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: pluginApp-release
          path: pluginApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
